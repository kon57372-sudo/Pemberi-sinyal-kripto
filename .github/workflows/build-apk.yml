name: Build HAM Signal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Path
        run: |
          echo "ANDROID_COMMANDLINE_TOOLS_VERSION=11076708" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Accept Android Licenses Manually
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        run: ./gradlew --no-daemon -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAM-Signal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


